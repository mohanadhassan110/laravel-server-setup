name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      # -x follows the source= directives pointing at lib/helpers.sh,
      # so cross-file issues are caught too, not just per-file syntax.
      - name: Run ShellCheck on all scripts
        run: shellcheck -x --severity=style install.sh lib/*.sh scripts/*.sh
