# ==============================================================================
# Laravel virtual host template
# Rendered by scripts/02-install-nginx.sh (and re-rendered by
# scripts/03-install-php.sh when the PHP version changes).
#
# Placeholders replaced at render time:
#   {{DOMAIN}}        - server_name / project domain
#   {{PROJECT_PATH}}  - absolute path to the deployed application
#   {{PHP_VERSION}}   - PHP minor version used for the FPM socket name
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    # Laravel serves everything from /public - never point the vhost root at
    # the project root itself or .env becomes downloadable.
    root {{PROJECT_PATH}}/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 32M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php{{PHP_VERSION}}-fpm.sock;
        fastcgi_index index.php;
        include snippets/fastcgi-php.conf;
    }

    # Block dotfiles (.env, .git, ...) while keeping ACME challenges reachable.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
