; ==============================================================================
; Laravel queue worker - Supervisor program template
; Rendered by scripts/08-setup-supervisor.sh.
;
; Placeholders replaced at render time:
;   {{PROGRAM_NAME}}  - supervisor program id (also used for log rotation ids)
;   {{PROJECT_PATH}}  - absolute path to the deployed Laravel application
;   {{QUEUE_NAME}}    - comma-separated queue names this pool consumes
;   {{NUM_WORKERS}}   - number of worker processes to keep running
; ==============================================================================

[program:{{PROGRAM_NAME}}]
process_name=%(program_name)s_%(process_num)02d
command=php {{PROJECT_PATH}}/artisan queue:work --queue={{QUEUE_NAME}} --sleep=3 --tries=3 --max-time=3600
directory={{PROJECT_PATH}}

; Start with the supervisor daemon and restart immediately after any failure
; or crash loop exit - workers must never stay down unnoticed.
autostart=true
autorestart=true

; Kill the whole process group so child processes do not survive reloads,
; and give long jobs time to finish before SIGKILL.
stopasgroup=true
killasgroup=true
stopwaitsecs=3600

; Run as the web user so storage/ permissions match the php-fpm user.
user=www-data
numprocs={{NUM_WORKERS}}
redirect_stderr=true
stdout_logfile={{PROJECT_PATH}}/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
